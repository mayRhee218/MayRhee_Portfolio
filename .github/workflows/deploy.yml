name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          unzip -q portfolio_site.zip -d _site
          cp ./*.html ./*.css ./*.js _site/
          cp robots.txt _site/robots.txt
          # Non-standard AI-use opt-out metadata (honoured only voluntarily).
          sed -i 's@</head>@  <meta name="robots" content="noai, noimageai">\n</head>@I' _site/*.html
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/assets/profile/Portrait.jpg
          test -f _site/robots.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
